name: CI

on:
  push:
    branches:
      - $default-branch
  pull_request:
    branches:
      - $default-branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != '$default-branch' }}

permissions:
  contents: read

jobs:
  lint:
    uses: maragudk/workflows/.github/workflows/lint.yml@main

  test:
    uses: maragudk/workflows/.github/workflows/test.yml@main

  # Uncomment for repositories with a Dockerfile.
  # build:
  #   uses: maragudk/workflows/.github/workflows/build.yml@main
